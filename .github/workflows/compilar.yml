name: Compilar launcher

# Cada push a main compila el launcher de Android (APK) y el de Windows (instalador y ZIP) y los publica
# como versión v<VERSION>. Si solo cambia catalogo.json no hace falta compilar: el launcher lo lee del repo.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'catalogo.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versión
        run: |
          echo "VERSION_NAME=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Interfaz dentro del APK
        run: |
          rm -rf android/app/src/main/assets/ui
          mkdir -p android/app/src/main/assets
          cp -r ui android/app/src/main/assets/ui
          cp catalogo.json android/app/src/main/assets/ui/catalogo.json

      - name: Compilar
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Port-Launcher-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Compilar
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          V=$(tr -d ' \r\n' < ../VERSION)
          npm run ui
          npx electron-builder --win --publish never -c.extraMetadata.version=$V.0

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Port-Launcher-Instalador.exe
            desktop/dist/Port-Launcher-Windows-*.zip

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Notas
        id: ver
        run: |
          echo "name=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B | grep -v '^Co-Authored-By\|^Claude-Session' > notas.md
          cat >> notas.md <<'EOF'

          **Android:** instala `Port-Launcher-Android.apk`.
          **Windows:** ejecuta `Port-Launcher-Instalador.exe` (o descomprime el ZIP y abre `Port Launcher.exe`).
          Desde ahí se instalan los juegos. El launcher avisa cuando hay una versión nueva de sí mismo.
          EOF
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Port Launcher ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          make_latest: true
          body_path: notas.md
